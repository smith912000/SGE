name: Deploy to GitHub Pages

# Pages for this repository serves the gh-pages BRANCH, not an Actions
# artifact. This workflow therefore builds and pushes the built site to
# gh-pages. Deploying an artifact instead would publish a build whose asset
# hashes do not match the index.html being served, and every lazily loaded
# tab chunk would 404.

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: rm -f package-lock.json
      - run: npm install
      - run: npm run build
      - run: touch dist/.nojekyll
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
